services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: relayforge
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U relayforge -d relayforge
      interval: 2s
      timeout: 2s
      retries: 15

  mock-provider:
    build:
      context: .
      dockerfile: mock_provider/Dockerfile
    ports:
      - "9000:9000"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://relayforge:relayforge@postgres:5432/relayforge
      ALPHA_BASE_URL: http://mock-provider:9000
      ALPHA_CLIENT_ID: relayforge
      ALPHA_CLIENT_SECRET: development-secret
      BETA_BASE_URL: http://mock-provider:9000
      BETA_API_KEY: development-beta-key
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_started
